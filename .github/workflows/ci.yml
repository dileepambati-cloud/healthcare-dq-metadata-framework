name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

  dq-sample-run:
    # end-to-end run on the sample data; publishes the HTML report as an artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run DQ checks on sample data
        run: |
          # sample data has bad records on purpose, so exit code 1 (HIGH failures) is expected here
          python run_dq.py --db dq.db --report || echo "DQ run reported failures (expected with sample data)"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: dq-report
          path: output/*.html
